name: Deploy Stock Blast Studio to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sleepy-fermi-ms6sj1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs for the same ref
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages for the repo on first run
          enablement: true

      # Publish only the Stock Blast Studio page, not the Trade Desk backend
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
